// ---------------------------------------------------------------------------
// Fastloader: the game data lives in feedthepit-src, split into parts small
// enough for jsDelivr (20 MiB per-file cap). We fetch the parts, merge them,
// cache the result in IndexedDB, then hand the bytes to the Godot engine.
// ---------------------------------------------------------------------------
const PART_COUNTS = { 'feedthepit.pck': 31, 'feedthepit.wasm': 2 };
const PART_BYTES = 19922944; // 19 MiB chunks; jsDelivr refuses a single file over 20 MiB
const FILE_BYTES = { 'feedthepit.pck': 612017416, 'feedthepit.wasm': 37902138 };
const BYTES_TOTAL = FILE_BYTES['feedthepit.pck'] + FILE_BYTES['feedthepit.wasm']; // 649919554
const MB_TOTAL = (BYTES_TOTAL / 1048576).toFixed(2); // "619.81"
const GODOT_THREADS_ENABLED = false;
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"feedthepit","experimentalVK":false,"fileSizes":{"feedthepit.pck":612017416,"feedthepit.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};

const CDN_BASE = document.baseURI;
const assetUrl = (name) => new URL(name, CDN_BASE).href;

const loadingText = document.querySelector('#loading-text');
let loadedBytes = 0;

// --- jsDelivr part merging -------------------------------------------------
function getParts(file, count) {
	// Every part is PART_BYTES except the final one, which holds the remainder.
	const lastBytes = FILE_BYTES[file] - (count - 1) * PART_BYTES;
	const out = [];
	for (let i = 1; i <= count; i++) {
		out.push({ name: `${file}.part${i}`, bytes: i === count ? lastBytes : PART_BYTES });
	}
	return out;
}

const PART_ATTEMPTS_MAX = 4;

async function fetchPart(name, expectedBytes) {
	let received = 0;
	for (let attempt = 1; ; attempt++) {
		received = 0;
		try {
			const response = await fetch(assetUrl(name));
			if (!response.ok) { throw new Error(`HTTP ${response.status}`); }
			const reader = response.body.getReader();
			const chunks = [];
			for (;;) {
				const { done, value } = await reader.read();
				if (done) { break; }
				received += value.length;
				loadedBytes += value.length;
				chunks.push(value);
				if (loadingText) {
					loadingText.textContent = `LOADING... ${(loadedBytes / 1048576).toFixed(2)} MB / ${MB_TOTAL} MB`;
				}
			}
			if (expectedBytes && received !== expectedBytes) {
				throw new Error(`short download, ${received} of ${expectedBytes} bytes`);
			}
			return new Blob(chunks);
		} catch (err) {
			// A freshly pushed commit can answer 403/404 for a short while while
			// jsDelivr indexes it, so a retry is usually all that is needed.
			loadedBytes -= received;
			if (attempt >= PART_ATTEMPTS_MAX) {
				throw new Error(`Failed to load ${name} after ${attempt} attempts: ${err && err.message ? err.message : err}`);
			}
			await new Promise((resolve) => setTimeout(resolve, 500 * attempt));
		}
	}
}

const DB_NAME = 'cachedb';
const STORE_NAME = 'files';

function openCacheDB() {
	return new Promise((resolve, reject) => {
		const req = indexedDB.open(DB_NAME, 1);
		req.onupgradeneeded = () => {
			const db = req.result;
			if (!db.objectStoreNames.contains(STORE_NAME)) { db.createObjectStore(STORE_NAME); }
		};
		req.onsuccess = () => resolve(req.result);
		req.onerror = () => reject(req.error);
	});
}

async function saveToCache(key, blob) {
	const db = await openCacheDB();
	return new Promise((resolve, reject) => {
		const tx = db.transaction(STORE_NAME, 'readwrite');
		tx.objectStore(STORE_NAME).put(blob, key);
		tx.oncomplete = () => resolve();
		tx.onerror = () => reject(tx.error);
	});
}

async function loadFromCache(key) {
	const db = await openCacheDB();
	return new Promise((resolve, reject) => {
		const tx = db.transaction(STORE_NAME, 'readonly');
		const req = tx.objectStore(STORE_NAME).get(key);
		req.onsuccess = () => resolve(req.result || null);
		req.onerror = () => reject(req.error);
	});
}

async function deleteFromCache(key) {
	const db = await openCacheDB();
	return new Promise((resolve, reject) => {
		const tx = db.transaction(STORE_NAME, 'readwrite');
		tx.objectStore(STORE_NAME).delete(key);
		tx.oncomplete = () => resolve();
		tx.onerror = () => reject(tx.error);
	});
}

async function mergeFiles(parts, cacheKey) {
	const expectedTotal = FILE_BYTES[cacheKey];
	try {
		const cached = await loadFromCache(cacheKey);
		if (cached && cached.size === expectedTotal) { return cached; }
		if (cached) { await deleteFromCache(cacheKey); }
	} catch (err) {
		console.warn('Cache read failed, downloading instead:', err);
	}
	const buffers = await Promise.all(parts.map((part) => fetchPart(part.name, part.bytes)));
	const merged = new Blob(buffers);
	// Never hand a truncated pack to the engine: it fails later with a
	// misleading error and the bad blob would have been cached.
	if (merged.size !== expectedTotal) {
		throw new Error(`${cacheKey} merged to ${merged.size} bytes, expected ${expectedTotal}`);
	}
	if (loadingText) { loadingText.textContent = `LOADING... ${MB_TOTAL} MB / ${MB_TOTAL} MB`; }
	try {
		await saveToCache(cacheKey, merged);
	} catch (err) {
		// A multi-hundred-MB blob can exceed the storage quota; playing from
		// memory is still fine, we just lose the cache.
		console.warn('Could not cache ' + cacheKey + ':', err);
	}
	return merged;
}

// --- serve merged bytes to the engine instead of the network ---------------
// Keyed by bare file name, so it matches however the engine resolves the URL.
const served = new Map();

(function installFetchShim() {
	const originalFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		let raw = null;
		if (typeof input === 'string') { raw = input; }
		else if (input instanceof URL) { raw = input.href; }
		else if (input && typeof input.url === 'string') { raw = input.url; }
		if (raw) {
			let name = null;
			try { name = new URL(raw, CDN_BASE).pathname.split('/').pop(); } catch (err) { name = null; }
			const hit = name ? served.get(name) : null;
			if (hit) {
				// Content-Type matters: the engine streams-compiles the wasm.
				return Promise.resolve(new Response(hit.blob, {
					status: 200,
					headers: { 'Content-Type': hit.type },
				}));
			}
		}
		return originalFetch(input, init);
	};
}());

// --- Godot status overlay --------------------------------------------------
const statusOverlay = document.getElementById('status');
const statusProgress = document.getElementById('status-progress');
const statusNotice = document.getElementById('status-notice');

let initializing = true;
let statusMode = '';

function setStatusMode(mode) {
	if (statusMode === mode || !initializing) { return; }
	if (mode === 'hidden') {
		statusOverlay.remove();
		initializing = false;
		return;
	}
	statusOverlay.style.visibility = 'visible';
	statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
	statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
	statusMode = mode;
}

function displayFailureNotice(err) {
	console.error(err);
	let text;
	if (err instanceof Error) { text = err.message; }
	else if (typeof err === 'string') { text = err; }
	else { text = 'An unknown error occurred.'; }
	while (statusNotice.lastChild) { statusNotice.removeChild(statusNotice.lastChild); }
	text.split('\n').forEach((line) => {
		statusNotice.appendChild(document.createTextNode(line));
		statusNotice.appendChild(document.createElement('br'));
	});
	setStatusMode('notice');
	initializing = false;
}

// --- boot ------------------------------------------------------------------
(async () => {
	try {
		if (loadingText) { loadingText.textContent = `LOADING... 0.00 MB / ${MB_TOTAL} MB`; }

		const [pck, wasm] = await Promise.all([
			mergeFiles(getParts('feedthepit.pck', PART_COUNTS['feedthepit.pck']), 'feedthepit.pck'),
			mergeFiles(getParts('feedthepit.wasm', PART_COUNTS['feedthepit.wasm']), 'feedthepit.wasm'),
		]);

		served.set('feedthepit.wasm', { blob: wasm, type: 'application/wasm' });
		served.set('feedthepit.pck', { blob: pck, type: 'application/octet-stream' });

		if (loadingText) { loadingText.remove(); }

		const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length !== 0) {
			displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
			return;
		}

		// startGame() preloads the main pack itself (preloadFile(pack, pack));
		// the fetch shim answers that request with the merged blob, so nothing
		// ever reaches the CDN for the pack.
		const engine = new Engine(GODOT_CONFIG);

		setStatusMode('progress');
		await engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		});
		setStatusMode('hidden');
	} catch (err) {
		try { await deleteFromCache('feedthepit.pck'); await deleteFromCache('feedthepit.wasm'); } catch (e) { /* ignore */ }
		displayFailureNotice(err);
	}
})();
		</script>
